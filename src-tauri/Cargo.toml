[package]
name = "tabulect"
version = "0.1.0"
description = "Tabulect"
authors = ["tabulect"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tabulect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
rfd = "0.15"
